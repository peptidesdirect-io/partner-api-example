name: Feature request
description: Suggest an improvement to the client or example in this repository
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This repository is a typed client and runnable example for the
        PeptidesDirect Partner API. Requests to change the API itself
        (endpoints, fields, behavior) should go to
        support@peptidesdirect.io instead, since this repo only mirrors it.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What are you trying to do that is currently hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see change in the client or example?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you have tried.
    validations:
      required: false
